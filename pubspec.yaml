  badges: ^3.2.0
  widget_to_marker: ^1.0.5
  flutter_background_service: ^5.1.0
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  injectable_generator: ^3.0.2
  retrofit_generator: ^10.2.6
#flutter packages pub run build_runner watch --delete-conflicting-outputs

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/images/icons/
    - assets/translations/
    - assets/map_style/


  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/poppins/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/poppins/Poppins-Thin.ttf
          weight: 100

    - family: Alexandria
      fonts:
        - asset: assets/fonts/alexandria/Alexandria-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/alexandria/Alexandria-Bold.ttf
          weight: 700
        - asset: assets/fonts/alexandria/Alexandria-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/alexandria/Alexandria-Medium.ttf
          weight: 500
        - asset: assets/fonts/alexandria/Alexandria-Regular.ttf
          weight: 400
        - asset: assets/fonts/alexandria/Alexandria-Light.ttf
          weight: 300
        - asset: assets/fonts/alexandria/Alexandria-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/alexandria/Alexandria-Thin.ttf
          weight: 100
