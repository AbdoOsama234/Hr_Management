  syncfusion_flutter_pdfviewer: ^33.2.10
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  file_picker: ^10.3.10
  intl_phone_field: ^3.2.0
  pinput: ^6.0.2
  shimmer: ^3.0.0
  carousel_slider: ^5.1.2
  flutter_native_splash: ^2.4.7
  country_picker: ^2.0.27
  translator: ^1.0.3+1
  awesome_dialog: ^3.2.1
  easy_localization: ^3.0.7
